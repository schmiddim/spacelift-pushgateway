name: Build and Push Docker Image
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver tag to release (e.g. v0.0.5). Leave empty to auto-increment patch.'
        required: false
        default: ''
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
permissions:
  contents: read
  packages: write

jobs:
  build_and_test:
    name: Build & Test the Application
    runs-on: ubuntu-latest
    outputs:
      commit_id: ${{ steps.meta.outputs.commit_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Tidy Go modules
        run: |
          go mod tidy
          if [[ -n $(git status --porcelain) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "chore: run go mod tidy"
            git push
          else
            echo "No changes detected"
          fi
      - name: Build
        run: go build -v -o exporter .
      - name: Test
        run: go test -v -coverprofile cover.out ./...
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image metadata
        id: metadata
        run: echo "commit_id=${GITHUB_SHA}" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value={{date 'YYYYMMDD-hhmmss' tz='Europe/Berlin'}}
            type=sha
            type=raw,value=${{ steps.metadata.outputs.commit_id }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_name == github.event.repository.default_branch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
  release:
    name: Release (Semver)
    needs: build_and_test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.author.name, 'dependabot') ||
      contains(github.event.head_commit.message, 'Bump ') ||
      contains(github.event.head_commit.message, 'bump ')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute next patch version
        id: version
        run: |
          git fetch --tags
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            NEW_TAG="${{ github.event.inputs.version }}"
            [[ "$NEW_TAG" != v* ]] && NEW_TAG="v${NEW_TAG}"
          else
            LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
            if [[ -z "$LAST_TAG" ]]; then
              LAST_TAG="v0.0.0"
            fi
            MAJOR=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag existing image with Semver (no rebuild)
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_tag }} \
            ${{ env.IMAGE_NAME }}:${{ needs.build_and_test.outputs.commit_id }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.new_tag }} \
            --title "${{ steps.version.outputs.new_tag }}" \
            --notes "## Docker Image

          \`\`\`
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_tag }}
          \`\`\`

          ### Helm values.yaml
          \`\`\`yaml
          image:
            repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            tag: \"${{ steps.version.outputs.new_tag }}\"
          \`\`\`"
      - name: Job Summary
        run: |
          TAG=${{ steps.version.outputs.new_tag }}
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Release ${TAG}

          ### Docker Pull
          \`\`\`
          docker pull ${IMAGE}:${TAG}
          \`\`\`

          ### Helm values.yaml
          \`\`\`yaml
          image:
            repository: ${IMAGE}
            tag: "${TAG}"
          \`\`\`

          ### Links
          - [DockerHub](https://hub.docker.com/r/${IMAGE}/tags?name=${TAG})
          - [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${TAG})
          EOF
